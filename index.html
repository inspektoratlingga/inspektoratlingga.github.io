<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Rekapitulasi Kerugian Daerah Kabupaten Lingga</title>
  <meta name="description" content="Aplikasi Rekapitulasi Kerugian Daerah Kabupaten Lingga">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .fallback {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      text-align: center;
    }

    .fallback-box {
      max-width: 560px;
      background: #fff;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, .10);
    }

    .fallback a {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 18px;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <iframe
    src="https://script.google.com/macros/s/AKfycbxvgF-OVLpKrZ54E4STXrV3X0TEpg0poMZnyXzwbf42_ekV7mWpVc8cGuoUhZ0gFhC19Q/exec"
    title="Aplikasi Rekapitulasi Kerugian Daerah Kabupaten Lingga"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <noscript>
    <div class="fallback">
      <div class="fallback-box">
        <h2>JavaScript diperlukan</h2>
        <p>Silakan aktifkan JavaScript pada browser untuk menggunakan aplikasi.</p>
        <a href="https://script.google.com/macros/s/AKfycbxvgF-OVLpKrZ54E4STXrV3X0TEpg0poMZnyXzwbf42_ekV7mWpVc8cGuoUhZ0gFhC19Q/exec">Buka Aplikasi</a>
      </div>
    </div>
  </noscript>

</body>
</html>
